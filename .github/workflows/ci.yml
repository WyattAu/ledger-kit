name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@173dc33a6b487fec375710e69531fbf1ff216922
    with:
      tier: a
      all-features: true
